name: ColegioCR - Levantamiento Basal

on:
  workflow_dispatch:

jobs:
  basal:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Chrome (método oficial GitHub Actions)
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa poppler-utils || true

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorios
        run: mkdir -p /tmp/logs /tmp/adjuntos /tmp/basal /tmp/screenshots

      - name: Ejecutar levantamiento basal
        env:
          CI: "true"
          WOOTIT_USER:       ${{ secrets.WOOTIT_USER }}
          WOOTIT_PASS:       ${{ secrets.WOOTIT_PASS }}
          GMAIL_PASS:        ${{ secrets.GMAIL_PASS }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import os, sys
          key = os.environ.get('ANTHROPIC_API_KEY','')
          print('ANTHROPIC_API_KEY:', 'CONFIGURADA (' + str(len(key)) + ' chars)' if key else 'VACIA')
          import selenium; print('selenium', selenium.__version__)
          import anthropic; print('anthropic', anthropic.__version__)
          print('Python', sys.version)
          "
          python basal.py

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basal-${{ github.run_id }}
          path: |
            /tmp/logs/
            /tmp/basal/
            /tmp/screenshots/
          retention-days: 90
