name: ColegioCR - Revisión Diaria 6PM

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 6:00 PM Costa Rica (UTC-6 = 00:00 UTC) — Lunes a Viernes
  workflow_dispatch:          # Ejecución manual para pruebas

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Chrome (método oficial GitHub Actions)
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            tesseract-ocr \
            tesseract-ocr-spa \
            poppler-utils || true

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Crear directorios temporales
        run: mkdir -p /tmp/logs /tmp/adjuntos /tmp/basal

      - name: Verificar instalación
        run: |
          python -c "import selenium; print('selenium', selenium.__version__)"
          python -c "import anthropic; print('anthropic', anthropic.__version__)"
          python -c "import chromedriver_autoinstaller; chromedriver_autoinstaller.install(); print('chromedriver OK')"
          google-chrome --version || chromium --version || echo "Chrome disponible via setup-chrome"

      - name: Ejecutar revisión diaria
        env:
          CI: "true"
          WOOTIT_USER:       ${{ secrets.WOOTIT_USER }}
          WOOTIT_PASS:       ${{ secrets.WOOTIT_PASS }}
          GMAIL_PASS:        ${{ secrets.GMAIL_PASS }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python revision_matutina.py

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: /tmp/logs/
          retention-days: 30
