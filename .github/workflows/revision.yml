name: ColegioCR - Revisión Diaria 6PM

on:
  schedule:
    - cron: '0 0 * * 1-5'   # 6:00 PM Costa Rica (UTC-6 = 00:00 UTC) — Lunes a Viernes
  workflow_dispatch:          # Ejecución manual para pruebas

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Chrome y dependencias del sistema
        run: |
          sudo apt-get update -q
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          sudo apt-get install -y -q \
            tesseract-ocr \
            tesseract-ocr-spa \
            poppler-utils \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 || true
          sudo apt-get install -y libasound2t64 2>/dev/null || sudo apt-get install -y libasound2 2>/dev/null || true

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Crear directorios temporales
        run: mkdir -p /tmp/logs /tmp/adjuntos /tmp/basal

      - name: Ejecutar revisión diaria
        env:
          CI: "true"
          WOOTIT_USER:       ${{ secrets.WOOTIT_USER }}
          WOOTIT_PASS:       ${{ secrets.WOOTIT_PASS }}
          GMAIL_PASS:        ${{ secrets.GMAIL_PASS }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python revision_matutina.py

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: /tmp/logs/
          retention-days: 30
